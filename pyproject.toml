[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sourccey-voice"
version = "0.1.0"
description = "Local, safety-bounded voice interaction for Sourccey"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Vulcan Robotics, Inc." }]
dependencies = [
    "numpy>=1.26,<3",
    "websockets>=15,<17",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.5,<1",
    "pywebrtc-audio>=0.1,<1",
]
stt = [
    "moonshine-voice>=0.0.50,<1",
    "silero-vad>=6,<7",
]
llm = ["llama-cpp-python>=0.3,<1"]
tts = [
    "kokoro>=0.9.4,<1",
    "soundfile>=0.13,<1",
]
models = ["huggingface-hub>=0.34,<2"]
voice = [
    "sounddevice>=0.5,<1",
    "pywebrtc-audio>=0.1,<1",
    "moonshine-voice>=0.0.50,<1",
    "silero-vad>=6,<7",
    "llama-cpp-python>=0.3,<1",
    "kokoro>=0.9.4,<1",
    "soundfile>=0.13,<1",
    "huggingface-hub>=0.34,<2",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
]

[project.scripts]
sourccey-voice = "sourccey_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sourccey_voice*"]

[tool.setuptools.package-data]
sourccey_voice = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
